# ========================================================================= #
#                      CHANTIK CONFIGURATION FILE                           #
# ========================================================================= #
# 🕊️ Chantik - ChaCha20-Authenticated Backup Protection                     #
# In ChaCha We Trust — Authentically Secured                                #
# ========================================================================= #

# ========================================================================= #
# REQUIRED CONFIGURATION                                                    #
# ========================================================================= #

# --- Backup Base Directory ---
# Where backups will be stored
# Note: This is where the backup subdirectories will be created
BACKUP_BASE_DIR="/path/to/backup"

# --- Source Directory ---
# The directory you want to backup
SOURCE_DIR="/home/user/my-projects"

# --- Encryption Key File ---
# Path to your encryption key file (generate with openssl rand -base64 32)
# IMPORTANT: Keep this file secure! Never commit to version control!
ENCRYPTION_KEY_FILE="/path/to/chantik/encryption.key"

# --- ntfy.sh Notification ---
# Get your token from: https://ntfy.sh/app
NTFY_TOPIC="CHANGE_ME_NTFY_TOPIC"
NTFY_TOKEN="CHANGE_ME_NTFY_TOKEN"


# ======================================================================== #
# VOLUME BACKUP CONFIGURATION                                              #
# ======================================================================== #

# --- Docker Volumes ---
# List of Docker volume names to backup
# Example: DOCKER_VOLUMES=("volume1" "volume2" "volume3")
# DOCKER_VOLUMES=(
#     # "postgres_data"
#     # "redis_data"
#     # "nginx_config"
# )

# --- Podman Volumes ---
# List of Podman volume names to backup
PODMAN_VOLUMES=(
    "forgejo_db_data"
    "forgejo_data"
)

# ======================================================================== #
# OPTIONAL CONFIGURATION                                                   #
# ======================================================================== #

# --- Container Runtime ---
# Options: "docker", "podman", or "auto"
# If "auto", it will detect available runtime (Podman preferred)
CONTAINER_RUNTIME="podman"

# --- Retention Policy ---
# Number of backups to keep for each category
RETENTION_DAILY=7      # Keep daily backups for 7 days
RETENTION_WEEKLY=4     # Keep weekly backups for 4 weeks
RETENTION_MONTHLY=6    # Keep monthly backups for 6 months

# --- Compression Level ---
# gzip compression level (1-9, where 9 is highest compression)
GZIP_LEVEL=6

# --- Docker Image ---
# Image used for container operations (must have tar and cp)
DOCKER_IMAGE="alpine:latest"

# --- Backup Prefix ---
# Prefix for backup directories
BACKUP_PREFIX="chantik-backup"

# --- Exclusion Patterns ---
# Comma-separated list of patterns to exclude from backup
# Example: EXCLUDE_PATTERNS="*.tmp,*.log,.cache,node_modules"
EXCLUDE_PATTERNS=""

# --- Maximum Backup Size (MB) ---
# Set to 0 to disable size limit
MAX_BACKUP_SIZE_MB=0

# --- Custom ntfy Server ---
# Set if using self-hosted ntfy server
NTFY_CUSTOM_SERVER="https://notify.ricalnet.my.id"

# --- Fixed Salt File ---
# For deterministic encryption (enables deduplication)
# Generate with: openssl rand -hex 8 > fixed_salt.txt
FIXED_SALT_FILE=""

# --- Deduplication Tool ---
# Options: "hardlink", "jdupes", or leave empty to disable
# Install with: apt install hardlink  or  brew install hardlink
DEDUP_TOOL="hardlink"

# --- PBKDF2 Iterations ---
# Number of iterations for key derivation (higher = more secure but slower)
# Minimum: 100000, Recommended: 600000+
PBKDF2_ITERATIONS=600000

# --- Incremental Backup ---
# Enable/disable incremental backups
INCREMENTAL_ENABLED="true"

# --- Full Backup Interval ---
# Number of days between full backups (when incremental is enabled)
FULL_BACKUP_INTERVAL=7

# --- Verbose Logging ---
# Set to "true" for debug output
VERBOSE=false

# ============================================================================ #
# END OF CONFIGURATION                                                        #
# ============================================================================ #